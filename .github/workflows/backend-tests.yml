name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY is set here on purpose — the suite mocks every
        # AI call, so it verifies the app's own logic (chunking, retrieval,
        # diffing, routing, session isolation), not the LLM, and never needs
        # a real secret to pass in CI.
        run: python -m pytest tests/ -v
